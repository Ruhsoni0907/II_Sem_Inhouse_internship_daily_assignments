<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Directory</title>

  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Bootstrap Icons (for eye / lock icons) -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    rel="stylesheet"
  />
  <!-- Custom Styles -->
  <link href="style.css" rel="stylesheet" />
</head>
<body>

  <!-- ==================== Navbar ==================== -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <i class="bi bi-mortarboard-fill"></i>
        Student Directory
      </a>
    </div>
  </nav>

  <!-- ==================== Main Content ==================== -->
  <main class="container py-5">

    <!-- Search / Filter -->
    <div class="search-wrapper">
      <input
        type="text"
        id="searchInput"
        class="form-control"
        placeholder="Search by name, branch or year (e.g. Priya, CS, 3rd)..."
      />
    </div>

    <!-- Cards grid — populated by jQuery -->
    <div id="studentGrid" class="row g-4"></div>

    <!-- No-results message -->
    <div id="noResults" class="no-results">
      <i class="bi bi-search"></i>
      <p class="mb-0">No students match your search.</p>
    </div>

  </main>

  <!-- ==================== Scripts ==================== -->
  <!-- jQuery (CDN) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- App scripts -->
  <script src="data.js"></script>
  <script src="script.js"></script>

</body>
</html>
